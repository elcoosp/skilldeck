[package]
name = "skilldeck"
version = "0.1.0"
description = "Local-first AI Orchestration for Developers"
authors = ["elcoosp"]
edition = "2024"
license = "MIT"
repository = "https://github.com/elcoosp/skilldeck"
readme = "../README.md"
keywords = ["ai", "tauri", "desktop", "llm", "orchestration"]
categories = ["development-tools", "gui"]

[workspace]
members = ["skilldeck-core", ".", "migration"]
resolver = "2"

[lib]
name = "skilldeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
[features]
e2e-testing = ["tauri-plugin-playwright"]
custom-protocol = ["tauri/custom-protocol"]
[dependencies]
tauri-plugin-playwright = { version = "0.4.1", optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-dialog = "2"
tokio = { version = "1.54.1", features = ["full"] }
sea-orm = { version = "2.0.0-rc.37", features = [
  "sqlx-sqlite",
  "runtime-tokio-native-tls",
] }
sea-query = "1.0.0-rc.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skilldeck-core = { path = "./skilldeck-core" }
skilldeck-lint = { path = "../skilldeck-lint" }
skilldeck-models = { path = "skilldeck-models" }
specta = { version = "=2.0.0-rc.28", features = [
  "chrono",
  "uuid",
  "serde_json",
] }
tauri-specta = { version = "2.0.0-rc.26", features = ["typescript", "derive"] }
specta-typescript = "0.0.13"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tauri-plugin-store = "2.5.0"
tauri-plugin-keyring = "0.1.0"
uuid = "1.29.0"
chrono = "0.4.45"
dashmap = "6.2.1"
tokio-util = "0.7.20"
parking_lot = "0.13.0"
toon-rust = "0.1.3"
dirs-next = "2.0.0"
toml = "1.2"
hex = "0.4"
async-trait = "0.1"
reqwest = { version = "0.13.5", features = ["json"] }
thiserror = "2"
anyhow = "1"
secrecy = { version = "0.10", features = ["serde"] }
futures = "0.3.34"
wiremock = "0.6.5"
walkdir = "2.5.0"
axum = "0.8.9"
adk-rust = "2.3.0"
async-stream = "0.3.6"
ignore = "0.4.34"
tauri-plugin-fs = "2"
regex = "1.13.1"
pulldown-cmark = "0.13.6"
tauri-plugin-devtools = "2.2.3"
tempfile = "3.27.0"
